name: Publish 19 intent-led mobile-plan pages
on:
  push:
    branches: [main]
  workflow_dispatch:
permissions:
  contents: read
  pages: write
  id-token: write
concurrency:
  group: github-pages
  cancel-in-progress: true
jobs:
  deploy:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
      - name: Generate 19 mobile plan pages
        run: node scripts/build-consumer-pages.mjs
      - name: Enrich consumer content and finder
        run: node scripts/enhance-postpaid-pages.mjs
      - name: Redesign for mobile-plan conversion
        run: node scripts/redesign-conversion.mjs
      - name: Validate SEO and internal links
        run: node scripts/validate-postpaid-site.mjs
      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with:
          path: site
      - uses: actions/deploy-pages@v4
