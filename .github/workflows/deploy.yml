name: Publish real-plan comparison catalog
on:
  push:
    branches: [main]
  workflow_dispatch:
permissions:
  contents: read
  pages: write
  id-token: write
concurrency:
  group: github-pages
  cancel-in-progress: true
jobs:
  deploy:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
      - name: Render 19 search pages with real plan lists
        run: node scripts/build-catalog.mjs
      - name: Add plan-specific choice and signup handoff
        run: node scripts/enhance-conversion.mjs
      - name: Build L7GB product story and connect catalog cards
        run: node scripts/build-product-story.mjs
      - name: Build story-driven shopping homepage
        run: node scripts/build-story-home.mjs
      - name: Check client scripts for syntax errors
        run: |
          node --check site/assets/catalog.js
          node --check site/assets/conversion.js
          node --check scripts/enhance-conversion.mjs
          node --check scripts/build-product-story.mjs
          node --check site/assets/product-story.js
          node --check scripts/build-story-home.mjs
          node --check site/assets/home.js
      - name: Check site structure and links
        run: node scripts/validate-catalog.mjs
      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with:
          path: site
      - uses: actions/deploy-pages@v4
